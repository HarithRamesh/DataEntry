version: '3.8'
services:
  web:
    depends_on:
      - api
    build: "react/app"
    ports:
      - 7777:7777
  api:
    depends_on:
      - db
    build: "."
    ports:
      - 7000:7000
  db:
    image: postgres:latest
    environment:
       POSTGRES_USER: "postgres"
       POSTGRES_PASSWORD: "abcd1234"
       POSTGRES_DB: "myDB"
    ports:
      - "5432:5433"